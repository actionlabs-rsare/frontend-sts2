name: sts_frontend
description: Stock Transfer System — Flutter web frontend
publish_to: "none"
version: 0.2.0

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: 1.0.8

  # State management
  flutter_bloc: 9.1.1

  # Dependency injection
  get_it: 9.3.0

  # Routing
  go_router: 18.0.2

  # Networking
  dio: 5.11.1

  # Immutable models / API request-response DTOs
  freezed_annotation: 3.1.0
  json_annotation: 4.12.0

  # Value equality for domain entities and bloc states
  equatable: 3.0.0

  # Responsive web layout
  responsive_framework: 1.5.1

  # i18n
  slang: 4.19.2
  slang_flutter: 4.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  build_runner: 2.16.1
  freezed: 4.0.2
  json_serializable: 6.14.1
  slang_build_runner: 4.19.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/roboto/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto/Roboto-Regular.ttf
          weight: 400
